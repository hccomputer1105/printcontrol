<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Licencia Vencida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card bg-secondary text-white p-4 text-center" style="max-width: 480px;">
        <h3 class="text-warning">⚠️ Licencia Expirada</h3>
        <p class="mt-2">La licencia de <strong>{{ empresa.nombre }}</strong> venció el <strong>{{ empresa.fecha_vencimiento|date:"d/m/Y" }}</strong>.</p>
        <p class="small">Todas las funciones del panel y el monitoreo de impresión han sido bloqueados. Contacta al administrador para renovar tu suscripción por 1 año.</p>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-light btn-sm mt-2">Cerrar Sesión</button>
        </form>
    </div>
</body>
</html>
